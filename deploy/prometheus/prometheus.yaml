global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: netops-api
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: [api:8000]
        labels: {namespace: netops, pod: compose-api}
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
