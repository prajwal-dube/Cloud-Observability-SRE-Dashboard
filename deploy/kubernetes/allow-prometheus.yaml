# Additive ingress allowance if Project 1's API NetworkPolicy is enabled and enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netops-api-prometheus
  namespace: netops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: lab
      component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
