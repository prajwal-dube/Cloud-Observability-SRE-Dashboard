# Overlay on Project 1 compose.yaml. OBS_PROJECT_DIR must be an absolute path.
services:
  api:
    build:
      context: ${OBS_PROJECT_DIR:?Set the absolute Project 3 root}/instrumented-api
    environment:
      OBS_DEMO_MODE: "false"
      OBS_DEMO_DELAY_MS: "0"
      OBS_DEMO_ERROR_EVERY: "0"
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ${OBS_PROJECT_DIR}/deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ${OBS_PROJECT_DIR}/deploy/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h", "--storage.tsdb.retention.size=512MB"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ${OBS_PROJECT_DIR}/deploy/alertmanager/local.yaml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ${OBS_PROJECT_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${OBS_PROJECT_DIR}/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
  alert-sink:
    build:
      context: ${OBS_PROJECT_DIR}/notification-sink
    ports: ["127.0.0.1:8085:8085"]
    read_only: true
    restart: unless-stopped
secrets:
  grafana_admin_password:
    file: ${OBS_PROJECT_DIR}/.secrets/grafana-admin-password
volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
